<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RPG Tools{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@400;700&display=swap"
        rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>

<body>
    <nav class="navbar">
        <a href="{{ url_for('index') }}" class="navbar-brand">RPG Tools</a>

        <button class="hamburger" id="hamburger" aria-label="Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="nav-links" id="navLinks">
            <a href="{{ url_for('index') }}" class="nav-link">Home</a>
            <a href="{{ url_for('combat') }}" class="nav-link">Combattimento</a>
            <a href="{{ url_for('shop') }}" class="nav-link">Negozio</a>
            <a href="{{ url_for('calendar') }}" class="nav-link">Calendario</a>
            <a href="{{ url_for('travel') }}" class="nav-link">Viaggi</a>
            <a href="{{ url_for('data_page') }}" class="nav-link">Dati</a>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
